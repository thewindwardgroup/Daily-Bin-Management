<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windward Store Performance Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#06142b;--panel:#0c2142;--panel2:#11294f;--line:#1d3a66;--ink:#f4f7fb;--mute:#8fa3c2;--dim:#5d7398;
    --good:#2fd17a;--ok:#f5b83d;--bad:#ff5a5f;--gold:#ffc83d;--silver:#cfd8e6;--bronze:#e0915a;--blue:#5cb8ff}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:var(--bg);overflow:hidden}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink)}
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;padding:44px 56px 36px;
    display:flex;flex-direction:column;gap:22px;background:radial-gradient(1200px 600px at 85% -10%,#173a73 0%,transparent 60%),var(--bg)}
  .cond{font-family:"Barlow Condensed",Inter,sans-serif}
  header{display:flex;align-items:flex-end;justify-content:space-between}
  .eyebrow{font-size:22px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
  h1{font-size:74px;line-height:1;font-weight:800;margin-top:6px}
  .when{text-align:right}.when .d{font-size:52px;font-weight:700;line-height:1}
  .when .s{font-size:22px;color:var(--mute);margin-top:6px}
  .colhead{display:grid;grid-template-columns:var(--cols);gap:16px;padding:0 24px;font-size:20px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--mute);font-weight:600}
  .colhead div{text-align:center}.colhead div:nth-child(2){text-align:left}
  .colhead small{display:block;font-size:15px;letter-spacing:.06em;text-transform:none;color:var(--dim);font-weight:500;margin-top:2px}
  #board{flex:1;display:flex;flex-direction:column;gap:16px;min-height:0}
  .row{flex:1;display:grid;grid-template-columns:var(--cols);gap:16px;align-items:center;min-height:0;
    background:linear-gradient(90deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:22px;padding:0 24px;position:relative;overflow:hidden}
  .row.first{border-color:rgba(255,200,61,.55);box-shadow:0 0 0 1px rgba(255,200,61,.25),0 18px 50px -20px rgba(255,200,61,.35)}
  .row.last{border-color:rgba(255,90,95,.5)}
  .crown{position:absolute;right:-30px;top:-30px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,61,.22),transparent 70%)}
  .rank{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:58px;font-weight:800;color:#0b1a33;background:var(--dim);justify-self:center}
  .r1 .rank{background:var(--gold)}.r2 .rank{background:var(--silver)}.r3 .rank{background:var(--bronze)}
  .store{display:flex;align-items:center;gap:14px;min-width:0}.store .txt{min-width:0}
  .store .nm{font-size:50px;font-weight:700;line-height:1;white-space:nowrap}
  .store .id{font-size:19px;color:var(--mute);margin-top:6px;letter-spacing:.06em;white-space:nowrap}
  .badge{flex:none;width:68px;height:68px;display:block}
  .tag{display:inline-block;font-size:17px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:3px 10px;border-radius:6px;margin-left:12px;vertical-align:2px}
  .tag.win{background:rgba(255,200,61,.18);color:var(--gold)}.tag.lose{background:rgba(255,90,95,.18);color:var(--bad)}
  .m{height:88%;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);position:relative}
  .m .v{font-size:56px;font-weight:700;line-height:1}
  .m .v small{font-size:.55em;font-weight:600;opacity:.8}
  .m .chg{font-size:20px;font-weight:600;margin-top:8px}
  .m .best{height:18px;margin-bottom:2px;font-size:14px;font-weight:700;letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
  .m.top{border-color:rgba(255,200,61,.45);background:rgba(255,200,61,.07)}
  .up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--mute)}
  .splh .goal{width:76%;height:10px;border-radius:5px;background:rgba(255,255,255,.12);margin-top:6px;position:relative}
  .splh .goal b{display:block;height:100%;border-radius:5px}
  .splh .goal i{position:absolute;top:-6px;width:3px;height:22px;background:#fff;border-radius:2px;opacity:.85}
  .g .v{color:var(--good)}.g .goal b{background:var(--good)}
  .o .v{color:var(--ok)}.o .goal b{background:var(--ok)}
  .b .v{color:var(--bad)}.b .goal b{background:var(--bad)}
  .g{background:rgba(47,209,122,.10);border-color:rgba(47,209,122,.35)}
  .o{background:rgba(245,184,61,.10);border-color:rgba(245,184,61,.35)}
  .b{background:rgba(255,90,95,.11);border-color:rgba(255,90,95,.4)}
  footer{display:grid;grid-template-columns:repeat(4,1fr) 1.3fr;gap:16px;align-items:stretch}
  .tot{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:12px 20px}
  .tot .k{font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600}
  .tot .v{font-size:40px;font-weight:700;line-height:1.05;margin-top:2px}
  .tot .v span{font-size:18px;font-family:Inter,sans-serif;font-weight:600;margin-left:10px}
  .src{font-size:17px;color:var(--mute);display:flex;flex-direction:column;justify-content:center;text-align:right;line-height:1.5}
</style>
</head>
<body>
<div id="stage">
  <header>
    <div><div class="eyebrow">Windward Group · Store Performance</div><h1 class="cond">YESTERDAY'S SCOREBOARD</h1></div>
    <div class="when"><div class="d cond" id="dateMain"></div><div class="s" id="rankNote"></div></div>
  </header>
  <div id="board"></div>
  <footer id="foot"></footer>
</div>
<script id="sales-data" type="application/json">{"date":"11/22/2026","prevDow":"Sat","splhGoal":65,
"stores":[
 {"name":"West Point","id":"74538","sales":5386.75,"orders":325,"hours":86.27,"prev":{"sales":6875.19,"orders":416,"hours":95.25}},
 {"name":"Philadelphia","id":"74394","sales":5816.29,"orders":294,"hours":102.92,"prev":{"sales":8474.80,"orders":457,"hours":101.88}},
 {"name":"Tupelo","id":"75041","sales":3689.88,"orders":203,"hours":85.57,"prev":{"sales":3803.78,"orders":221,"hours":103.73}},
 {"name":"Pontotoc","id":"74318","sales":6379.09,"orders":335,"hours":134.18,"prev":{"sales":6622.67,"orders":365,"hours":130.68}}
]}
</script>
<script>
(function(){
  var D=JSON.parse(document.getElementById('sales-data').textContent), G=D.splhGoal;
  var cols='130px minmax(0,1.9fr) repeat(4,minmax(0,1fr))';
  document.getElementById('stage').style.setProperty('--cols',cols);
  function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
  function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML;}
  function money(v,dec){return '$'+v.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});}
  function chg(cur,prev,kind){
    if(prev==null||!isFinite(prev)||prev===0) return '';
    var d=cur-prev, c=d>0.0001?'up':d<-0.0001?'down':'flat', a=d>0.0001?'▲ ':d<-0.0001?'▼ ':'● ', txt;
    if(kind==='pct') txt=Math.abs(d/prev*100).toFixed(1)+'%';
    else if(kind==='int') txt=Math.abs(Math.round(d)).toLocaleString('en-US');
    else txt='$'+Math.abs(d).toFixed(2);
    return '<div class="chg '+c+'">'+a+txt+' vs '+esc(D.prevDow)+'</div>';
  }
  D.stores.forEach(function(s){
    s.splh=s.hours?s.sales/s.hours:null; s.avg=s.orders?s.sales/s.orders:null;
    var p=s.prev||{}; s.pSplh=p.hours?p.sales/p.hours:null; s.pAvg=p.orders?p.sales/p.orders:null;
  });
  var dt=new Date(D.date);
  document.getElementById('dateMain').textContent=dt.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  document.getElementById('rankNote').innerHTML='Ranked by SPLH (sales per labor hour) · Goal '+money(G,0);

  var list=D.stores.slice().sort(function(a,b){return (b.splh||0)-(a.splh||0);});
  list.forEach(function(x,i){x.rank=(i>0&&x.splh===list[i-1].splh)?list[i-1].rank:i+1;});
  var lastRank=list[list.length-1].rank;
  function maxOf(k){return Math.max.apply(null,D.stores.map(function(s){return s[k]||0;}));}
  var best={sales:maxOf('sales'),orders:maxOf('orders'),avg:maxOf('avg'),splh:maxOf('splh')};

  var TROPHY='<svg class="badge" viewBox="0 0 64 64"><defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe17a"/><stop offset="1" stop-color="#f0a500"/></linearGradient></defs><path d="M18 10h28v14c0 9-6 16-14 16s-14-7-14-16z" fill="url(#tg)"/><path d="M18 14H9c0 9 4 14 11 15M46 14h9c0 9-4 14-11 15" fill="none" stroke="#f5b83d" stroke-width="4" stroke-linecap="round"/><rect x="28" y="39" width="8" height="9" fill="#e09a00"/><rect x="20" y="47" width="24" height="7" rx="2" fill="#f5b83d"/><rect x="16" y="53" width="32" height="5" rx="2" fill="#c98300"/><path d="M32 16l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z" fill="#fff6d6"/></svg>';
  var SAD='<svg class="badge" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="#ff5a5f"/><ellipse cx="22.5" cy="26" rx="4" ry="5" fill="#2a0a12"/><ellipse cx="41.5" cy="26" rx="4" ry="5" fill="#2a0a12"/><path d="M20 47c3.5-7 20.5-7 24 0" fill="none" stroke="#2a0a12" stroke-width="4" stroke-linecap="round"/><path d="M18 33c-1.5 3-3 5-3 7a3 3 0 0 0 6 0c0-2-1.5-4-3-7z" fill="#7cc8ff"/></svg>';

  var board=document.getElementById('board'), head=el('div','colhead');
  [['Rank',''],['Location',''],['Net Sales',''],['SPLH','goal '+money(G,0)],['Order Count',''],['Order Average','']].forEach(function(h){
    head.appendChild(el('div',null,esc(h[0])+(h[1]?'<small>'+esc(h[1])+'</small>':'')));});
  board.appendChild(head);

  list.forEach(function(x){
    var first=x.rank===1, last=list.length>1&&x.rank===lastRank&&!first;
    var row=el('div','row r'+x.rank+(first?' first':'')+(last?' last':''));
    if(first) row.appendChild(el('div','crown'));
    row.appendChild(el('div','rank cond',String(x.rank)));
    var st=el('div','store'); if(first) st.appendChild(el('div',null,TROPHY)); if(last) st.appendChild(el('div',null,SAD));
    var tx=el('div','txt'); tx.appendChild(el('div','nm cond',esc(x.name)));
    tx.appendChild(el('div','id','Store #'+esc(x.id)+(first?'<span class="tag win">Top store</span>':last?'<span class="tag lose">Needs work</span>':'')));
    st.appendChild(tx); row.appendChild(st);
    function cell(k,html,extra,cls){var c=el('div','m '+(cls||'')+(x[k]===best[k]&&k!=='splh'?' top':''));
      c.appendChild(el('div','best',(x[k]===best[k]&&k!=='splh')?'★ Best in group':''));
      c.appendChild(el('div','v cond',html)); if(extra) c.insertAdjacentHTML('beforeend',extra); return c;}
    var p=x.prev||{};
    row.appendChild(cell('sales',money(x.sales,0),chg(x.sales,p.sales,'pct')));
    var sc=x.splh>=G?'g':x.splh>=G*0.85?'o':'b';
    var sp=cell('splh',money(x.splh,2),'<div class="goal"><b style="width:'+Math.min(100,x.splh/(G*1.3)*100)+'%"></b><i style="left:'+(100/1.3)+'%"></i></div>'+chg(x.splh,x.pSplh,'money'),'splh '+sc);
    row.appendChild(sp);
    row.appendChild(cell('orders',x.orders.toLocaleString('en-US'),chg(x.orders,p.orders,'int')));
    row.appendChild(cell('avg',money(x.avg,2),chg(x.avg,x.pAvg,'money')));
    board.appendChild(row);
  });

  var S=0,O=0,H=0,pS=0,pO=0,pH=0; D.stores.forEach(function(s){S+=s.sales;O+=s.orders;H+=s.hours;if(s.prev){pS+=s.prev.sales;pO+=s.prev.orders;pH+=s.prev.hours;}});
  function tchg(cur,prev,kind){var h=chg(cur,prev,kind);return h.replace('<div class="chg ','<span class="').replace('</div>','</span>').replace(/ vs \w+/,'');}
  var f=document.getElementById('foot');
  [['Windward Net Sales',money(S,0)+tchg(S,pS,'pct')],['Windward SPLH',money(S/H,2)+tchg(S/H,pS/pH,'money')],
   ['Windward Orders',O.toLocaleString('en-US')+tchg(O,pO,'int')],['Windward Order Avg',money(S/O,2)+tchg(S/O,pS/pO,'money')]].forEach(function(t){
    var b=el('div','tot'); b.appendChild(el('div','k',esc(t[0]))); b.appendChild(el('div','v cond',t[1])); f.appendChild(b);});
  f.appendChild(el('div','src','Source: PAR POS · '+esc(D.date)+'<br>SPLH = net sales ÷ labor hours'));

  function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080),st=document.getElementById('stage');
    st.style.transform='translate('+((innerWidth-1920*s)/2)+'px,'+((innerHeight-1080*s)/2)+'px) scale('+s+')';}
  addEventListener('resize',fit); fit();
  setTimeout(function(){location.reload();},30*60*1000);
})();
</script>
</body>
</html>
